name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    name: Build Android OpenJDK 17 ARM64

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TERMUX_ARCH: aarch64

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Installing host dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            ca-certificates \
            bison \
            flex \
            gawk \
            gettext \
            python3 \
            python3-pip \
            lzip \
            jq \
            gnupg

          echo ""
          echo "Host dependencies installed."


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Installing Java 17"
          echo "=========================================="

          sudo apt-get install -y openjdk-17-jdk

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "JAVA_HOME candidates:"
          ls -la /usr/lib/jvm/ || true


      # ============================================================
      # 4. CLONE TERMUX PACKAGES
      # ============================================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Cloning Termux packages"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          cd termux-packages

          echo ""
          echo "Termux commit:"
          git rev-parse HEAD


      # ============================================================
      # 5. SETUP TERMUX UBUNTU ENVIRONMENT
      # ============================================================

      - name: Setup Termux Ubuntu environment
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "Setting up Termux build environment"
          echo "=========================================="

          chmod +x scripts/setup-ubuntu.sh

          ./scripts/setup-ubuntu.sh

          echo ""
          echo "Termux Ubuntu environment ready."


      # ============================================================
      # 6. SETUP ANDROID SDK + NDK
      # ============================================================

      - name: Setup Android SDK and NDK
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "Setting up Android SDK and NDK"
          echo "=========================================="

          chmod +x scripts/setup-android-sdk.sh

          ./scripts/setup-android-sdk.sh

          echo ""
          echo "SDK/NDK setup completed."


      # ============================================================
      # 7. DETECT ACTUAL SDK / NDK
      # ============================================================

      - name: Detect Android SDK and NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Detecting Android SDK and NDK"
          echo "=========================================="

          echo ""
          echo "HOME:"
          echo "$HOME"

          echo ""
          echo "HOME/lib:"
          ls -lah "$HOME/lib" || true


          # --------------------------------------------------------
          # FIND SDK
          # --------------------------------------------------------

          SDK=""

          if [ -d "$HOME/lib/android-sdk" ]; then

            SDK="$HOME/lib/android-sdk"

          else

            SDK=$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name "android-sdk*" \
              -print -quit \
              2>/dev/null || true)

          fi


          # --------------------------------------------------------
          # FIND NDK
          # --------------------------------------------------------

          NDK=""

          if [ -d "$HOME/lib/android-ndk-r29" ]; then

            NDK="$HOME/lib/android-ndk-r29"

          else

            NDK=$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name "android-ndk-r*" \
              -print -quit \
              2>/dev/null || true)

          fi


          # --------------------------------------------------------
          # SDK CHECK
          # --------------------------------------------------------

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then

            echo ""
            echo "ERROR: Android SDK not found."

            echo ""
            echo "Searching:"
            find "$HOME/lib" \
              -maxdepth 2 \
              -type d \
              -iname "*android*" \
              -print || true

            exit 1

          fi


          # --------------------------------------------------------
          # NDK CHECK
          # --------------------------------------------------------

          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then

            echo ""
            echo "ERROR: Android NDK not found."

            find "$HOME/lib" \
              -maxdepth 2 \
              -type d \
              -iname "*ndk*" \
              -print || true

            exit 1

          fi


          # --------------------------------------------------------
          # FIND JAVA
          # --------------------------------------------------------

          JAVA_HOME_DIR=""

          if [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then

            JAVA_HOME_DIR="/usr/lib/jvm/java-17-openjdk-amd64"

          else

            JAVA_HOME_DIR=$(dirname \
              "$(dirname \
                "$(readlink -f "$(command -v java)")" \
              )" \
            )

          fi


          # --------------------------------------------------------
          # EXPORT
          # --------------------------------------------------------

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"

          echo "TERMUX_ARCH=aarch64" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "DETECTED ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$SDK"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME_DIR"


      # ============================================================
      # 8. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID SDK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          if [ ! -d "$ANDROID_HOME" ]; then

            echo "ERROR: Android SDK directory missing."

            exit 1

          fi


          SDKMANAGER=""

          if [ -x \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
          ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"

          else

            SDKMANAGER=$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print -quit \
              2>/dev/null || true)

          fi


          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo ""
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi


          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"


          echo ""
          echo "Installed SDK packages:"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed \
            || true


      # ============================================================
      # 9. VERIFY NDK
      # ============================================================

      - name: Verify Android NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID NDK"
          echo "=========================================="

          echo ""
          echo "NDK:"
          echo "$NDK"


          if [ ! -d "$NDK" ]; then

            echo "ERROR: NDK directory missing."

            exit 1

          fi


          if [ ! -f "$NDK/source.properties" ]; then

            echo "ERROR: NDK source.properties missing."

            exit 1

          fi


          echo ""
          echo "NDK version:"

          cat "$NDK/source.properties"


          echo ""
          echo "NDK clang:"

          test -f \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          echo "clang found."


      # ============================================================
      # 10. CHECK OPENJDK RECIPE
      # ============================================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          RECIPE="termux-packages/packages/openjdk-17/build.sh"

          echo "=========================================="
          echo "Checking OpenJDK 17 recipe"
          echo "=========================================="

          if [ ! -f "$RECIPE" ]; then

            echo "ERROR: Recipe not found."

            exit 1

          fi


          echo ""
          echo "Recipe:"
          echo "$RECIPE"


          echo ""
          echo "Recipe contents:"

          sed -n '1,300p' "$RECIPE"


      # ============================================================
      # 11. VERIFY ENVIRONMENT
      # ============================================================

      - name: Verify build environment
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "Java:"
          "$JAVA_HOME/bin/java" -version

          echo ""
          echo "Javac:"
          "$JAVA_HOME/bin/javac" -version


      # ============================================================
      # 12. BUILD OPENJDK 17 ARM64
      # ============================================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e
          set -o pipefail

          cd termux-packages


          # --------------------------------------------------------
          # IMPORTANT:
          # Let Termux properties.sh configure JAVA_HOME.
          # --------------------------------------------------------

          export TERMUX_ARCH=aarch64

          export TERMUX_FORCE_BUILD=true

          export TERMUX_INSTALL_DEPS=true


          # --------------------------------------------------------
          # SDK
          # --------------------------------------------------------

          export ANDROID_HOME="$ANDROID_HOME"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"


          # --------------------------------------------------------
          # NDK
          # --------------------------------------------------------

          export NDK="$NDK"


          # --------------------------------------------------------
          # JAVA
          # --------------------------------------------------------

          export JAVA_HOME="$JAVA_HOME"


          echo ""
          echo "=========================================="
          echo "BUILDING OPENJDK 17"
          echo "=========================================="

          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java version:"

          "$JAVA_HOME/bin/java" -version


          echo ""
          echo "Starting build..."


          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ============================================================
      # 13. FIND GENERATED DEB
      # ============================================================

      - name: Locate generated OpenJDK package
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "LOCATING OPENJDK PACKAGE"
          echo "=========================================="


          echo ""
          echo "DEB files:"

          find termux-packages \
            -type f \
            -name "*.deb" \
            -print \
            | grep -i openjdk \
            || true


          echo ""
          echo "All OpenJDK files:"

          find termux-packages \
            -type f \
            -iname "*openjdk*" \
            -print \
            || true


      # ============================================================
      # 14. PREPARE STANDALONE JDK
      # ============================================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "PREPARING STANDALONE JDK"
          echo "=========================================="


          rm -rf output

          mkdir -p output


          # --------------------------------------------------------
          # Find generated DEB
          # --------------------------------------------------------

          DEB=""

          DEB=$(find termux-packages \
            -type f \
            -name "*openjdk*17*.deb" \
            -print -quit \
            2>/dev/null || true)


          # --------------------------------------------------------
          # Search all deb files if exact name differs
          # --------------------------------------------------------

          if [ -z "$DEB" ]; then

            DEB=$(find termux-packages \
              -type f \
              -name "*.deb" \
              -print \
              2>/dev/null \
              | grep -i openjdk \
              | head -1 \
              || true)

          fi


          if [ -z "$DEB" ]; then

            echo ""
            echo "ERROR: OpenJDK DEB not found."

            echo ""
            echo "Searching package output..."

            find termux-packages \
              -type f \
              -name "*.deb" \
              -print \
              | head -200 \
              || true

            exit 1

          fi


          echo ""
          echo "Found OpenJDK package:"
          echo "$DEB"


          # --------------------------------------------------------
          # Extract DEB
          # --------------------------------------------------------

          rm -rf extracted-jdk

          mkdir -p extracted-jdk


          dpkg-deb \
            -x "$DEB" \
            extracted-jdk


          echo ""
          echo "Extracted package."


          # --------------------------------------------------------
          # Find JDK directory
          # --------------------------------------------------------

          JDK_DIR=""

          JDK_DIR=$(find extracted-jdk \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print -quit \
            2>/dev/null || true)


          if [ -z "$JDK_DIR" ]; then

            JDK_DIR=$(find extracted-jdk \
              -type d \
              -path "*/lib/jvm/java-17-openjdk*" \
              -print -quit \
              2>/dev/null || true)

          fi


          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: JDK directory not found inside DEB."

            echo ""
            echo "Extracted structure:"

            find extracted-jdk \
              -maxdepth 6 \
              -type d \
              -print \
              | head -300

            exit 1

          fi


          echo ""
          echo "JDK directory:"
          echo "$JDK_DIR"


          # --------------------------------------------------------
          # Copy
          # --------------------------------------------------------

          mkdir -p output/jdk-17


          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


          echo ""
          echo "Standalone JDK prepared."


      # ============================================================
      # 15. VERIFY JDK STRUCTURE
      # ============================================================

      - name: Verify JDK structure
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "VERIFY JDK STRUCTURE"
          echo "=========================================="


          if [ ! -f "$JDK/bin/java" ]; then

            echo "ERROR: bin/java missing."

            exit 1

          fi


          if [ ! -f "$JDK/bin/javac" ]; then

            echo "ERROR: bin/javac missing."

            exit 1

          fi


          if [ ! -d "$JDK/lib" ]; then

            echo "ERROR: lib directory missing."

            exit 1

          fi


          echo ""
          echo "java:"
          ls -lh "$JDK/bin/java"


          echo ""
          echo "javac:"
          ls -lh "$JDK/bin/javac"


          echo ""
          echo "JDK structure OK."


      # ============================================================
      # 16. CLEAN JDK
      # ============================================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "CLEANING JDK"
          echo "=========================================="


          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include"


          rm -rf \
            "$JDK/share/doc" \
            "$JDK/share/man"


          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o \
              -name "*.debug" \
            \) \
            -delete


          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;


          echo ""
          echo "JDK cleaned."


      # ============================================================
      # 17. FIX EXECUTABLE PERMISSIONS
      # ============================================================

      - name: Fix executable permissions
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          if [ -d "$JDK/bin" ]; then

            chmod +x "$JDK/bin/"* || true

          fi


          echo ""
          echo "java:"
          ls -lh "$JDK/bin/java"


          echo ""
          echo "javac:"
          ls -lh "$JDK/bin/javac"


      # ============================================================
      # 18. VERIFY ARM64
      # ============================================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "VERIFYING ARM64"
          echo "=========================================="


          echo ""
          echo "java:"
          file "$JDK/bin/java"


          echo ""
          echo "javac:"
          file "$JDK/bin/javac"


          # --------------------------------------------------------
          # Java is normally an ELF launcher.
          # --------------------------------------------------------

          if ! file "$JDK/bin/java" | grep -Eiq \
            "aarch64|ARM64|ARM aarch64"; then

            echo ""
            echo "ERROR: java is not ARM64."

            exit 1

          fi


          echo ""
          echo "ARM64 verification successful."


      # ============================================================
      # 19. CREATE INFO FILE
      # ============================================================

      - name: Create AndroidJDK metadata
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          cat > "$JDK/ANDROIDJDK_INFO.txt" <<EOF
AndroidJDK

Distribution: SgmApp AndroidJDK
Java: OpenJDK 17
Architecture: ARM64 / AArch64
Platform: Android / Termux

Repository:
https://github.com/SgmApp/AndroidJDK
EOF


      # ============================================================
      # 20. CREATE ZIP
      # ============================================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "CREATING JDK ZIP"
          echo "=========================================="


          rm -f android-jdk17-arm64.zip


          cd output


          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17


          cd ..


          echo ""
          echo "Created ZIP:"

          ls -lh \
            android-jdk17-arm64.zip


      # ============================================================
      # 21. TEST ZIP
      # ============================================================

      - name: Test JDK ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "TESTING ZIP"
          echo "=========================================="


          unzip -t \
            android-jdk17-arm64.zip


          echo ""
          echo "ZIP test successful."


      # ============================================================
      # 22. SHOW ZIP CONTENTS
      # ============================================================

      - name: Show ZIP contents
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "ZIP CONTENTS"
          echo "=========================================="


          unzip -l \
            android-jdk17-arm64.zip \
            | head -200


      # ============================================================
      # 23. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e

          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256


          echo ""
          echo "SHA256:"
          cat android-jdk17-arm64.zip.sha256


      # ============================================================
      # 24. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4

        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 25. CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
