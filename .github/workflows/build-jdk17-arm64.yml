name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    name: Android OpenJDK 17 - ARM64

    runs-on: ubuntu-22.04

    env:
      TERMUX_ARCH: aarch64

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================

      - name: Install build dependencies
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial

          echo "=========================================="
          echo "Dependencies installed"
          echo "=========================================="


      # ==========================================
      # CLONE TERMUX PACKAGES
      # ==========================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          cd termux-packages

          echo "=========================================="
          echo "Termux packages cloned"
          echo "=========================================="

          git rev-parse HEAD


      # ==========================================
      # CHECK OPENJDK 17 RECIPE
      # ==========================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          RECIPE="termux-packages/packages/openjdk-17/build.sh"

          if [ ! -f "$RECIPE" ]; then

            echo "ERROR: OpenJDK 17 recipe not found."

            exit 1

          fi

          echo "=========================================="
          echo "OpenJDK 17 recipe found"
          echo "=========================================="

          sed -n '1,260p' "$RECIPE"


      # ==========================================
      # BUILD OPENJDK 17 ARM64
      # ==========================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e

          cd termux-packages

          export TERMUX_ARCH=aarch64
          export TERMUX_FORCE_BUILD=true
          export TERMUX_INSTALL_DEPS=true

          echo "=========================================="
          echo "Android OpenJDK 17 ARM64"
          echo "Architecture: aarch64"
          echo "=========================================="

          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ==========================================
      # LOCATE GENERATED JDK
      # ==========================================

      - name: Locate generated JDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Searching for OpenJDK output"
          echo "=========================================="

          find termux-packages \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print || true

          echo ""
          echo "Searching OpenJDK files..."

          find termux-packages \
            -type f \
            \( \
              -name "*openjdk*17*" \
              -o \
              -name "openjdk*.deb" \
            \) \
            -print || true


      # ==========================================
      # PREPARE STANDALONE JDK
      # ==========================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e

          rm -rf output

          mkdir -p output

          echo "=========================================="
          echo "Finding JDK directory"
          echo "=========================================="

          JDK_DIR=$(find termux-packages \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print -quit)

          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: OpenJDK directory not found."
            echo ""

            echo "Searching all java directories:"

            find termux-packages \
              -type d \
              -path "*/lib/jvm/*" \
              -print || true

            echo ""

            exit 1

          fi

          echo "JDK directory:"
          echo "$JDK_DIR"

          mkdir -p output/jdk-17

          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


      # ==========================================
      # SHOW JDK STRUCTURE
      # ==========================================

      - name: Show JDK structure
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "JDK structure"
          echo "=========================================="

          find output/jdk-17 \
            -maxdepth 3 \
            -type f \
            -print | head -300


      # ==========================================
      # CLEAN JDK
      # ==========================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "Cleaning JDK"
          echo "=========================================="

          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include"

          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o \
              -name "*.debug" \
            \) \
            -delete

          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;

          echo "JDK cleaned."


      # ==========================================
      # FIX EXECUTABLE PERMISSIONS
      # ==========================================

      - name: Set executable permissions
        shell: bash
        run: |

          set -e

          chmod +x \
            output/jdk-17/bin/* \
            2>/dev/null || true

          echo ""
          echo "Java:"

          ls -l \
            output/jdk-17/bin/java

          echo ""
          echo "Javac:"

          ls -l \
            output/jdk-17/bin/javac


      # ==========================================
      # VERIFY JDK
      # ==========================================

      - name: Verify JDK files
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Verifying JDK"
          echo "=========================================="

          test -f \
            output/jdk-17/bin/java

          test -f \
            output/jdk-17/bin/javac

          test -d \
            output/jdk-17/lib

          echo "java found"
          echo "javac found"
          echo "lib directory found"

          echo ""
          echo "JDK binaries:"

          find output/jdk-17/bin \
            -maxdepth 1 \
            -type f \
            -print


      # ==========================================
      # CHECK ARM64 BINARY
      # ==========================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Checking Java binary architecture"
          echo "=========================================="

          file \
            output/jdk-17/bin/java

          echo ""

          file \
            output/jdk-17/bin/javac

          echo ""

          echo "Expected architecture:"
          echo "aarch64 / ARM64"


      # ==========================================
      # CREATE ZIP
      # ==========================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e

          rm -f \
            android-jdk17-arm64.zip

          cd output

          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17

          cd ..

          echo "=========================================="
          echo "JDK ZIP created"
          echo "=========================================="

          ls -lh \
            android-jdk17-arm64.zip


      # ==========================================
      # TEST ZIP
      # ==========================================

      - name: Test ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Testing ZIP"
          echo "=========================================="

          unzip -t \
            android-jdk17-arm64.zip

          echo ""
          echo "ZIP test successful."


      # ==========================================
      # SHOW ZIP CONTENT
      # ==========================================

      - name: Show ZIP content
        shell: bash
        run: |

          set -e

          unzip -l \
            android-jdk17-arm64.zip \
            | head -200


      # ==========================================
      # SHA256
      # ==========================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e

          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256

          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat \
            android-jdk17-arm64.zip.sha256


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4
        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          retention-days: 30


      # ==========================================
      # CREATE / UPDATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: jdk17

          name: Android OpenJDK 17 ARM64

          body: |
            Android OpenJDK 17 for ARM64 Android devices.

            Architecture:
            aarch64 / ARM64

            Java:
            OpenJDK 17

            Package:
            android-jdk17-arm64.zip

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: false
