name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    name: Android OpenJDK 17 ARM64

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TERMUX_ARCH: aarch64

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL HOST DEPENDENCIES
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            bison \
            flex \
            gawk \
            gettext \
            python3 \
            python3-pip \
            python3-venv

          echo "Host dependencies installed."


      # ============================================================
      # 3. INSTALL JAVA 17
      # ============================================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          sudo apt-get install -y openjdk-17-jdk

          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"

          if [ ! -d "$JAVA17" ]; then
            echo "ERROR: Java 17 not found."
            exit 1
          fi

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"

          echo "$JAVA17/bin" >> "$GITHUB_PATH"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA17"

          echo ""
          echo "Java version:"
          "$JAVA17/bin/java" -version

          echo ""
          echo "Javac version:"
          "$JAVA17/bin/javac" -version


      # ============================================================
      # 4. CLONE TERMUX PACKAGES
      # ============================================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          cd termux-packages

          echo ""
          echo "Termux commit:"
          git rev-parse HEAD


      # ============================================================
      # 5. INITIALIZE TERMUX BUILD SYSTEM
      # ============================================================

      - name: Initialize Termux build system
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "Initializing Termux build system"
          echo "=========================================="

          chmod +x \
            build-package.sh \
            scripts/*.sh \
            2>/dev/null || true

          echo ""
          echo "Termux build script:"
          ls -lh build-package.sh


      # ============================================================
      # 6. SET TERMUX BUILD CONFIGURATION
      # ============================================================

      - name: Configure Termux build
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "Configuring Termux"
          echo "=========================================="

          # --------------------------------------------------------
          # IMPORTANT:
          # Termux build system reads TERMUX_ARCH from this file
          # --------------------------------------------------------

          echo "aarch64" > /tmp/termux-arch

          export TERMUX_ARCH=aarch64

          # Make architecture available to child processes.
          export TERMUX_FORCE_BUILD=true

          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "Environment:"
          env | grep '^TERMUX_' || true


      # ============================================================
      # 7. PREPARE TERMUX BUILD DIRECTORY
      # ============================================================

      - name: Prepare Termux directories
        shell: bash
        run: |

          set -e

          cd termux-packages

          mkdir -p \
            build \
            debs \
            debs/aarch64 \
            output \
            cache \
            packages

          echo "Termux directories prepared."


      # ============================================================
      # 8. CHECK OPENJDK RECIPE
      # ============================================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          RECIPE="termux-packages/packages/openjdk-17/build.sh"

          echo "=========================================="
          echo "Checking OpenJDK 17 recipe"
          echo "=========================================="

          if [ ! -f "$RECIPE" ]; then

            echo ""
            echo "ERROR:"
            echo "OpenJDK 17 recipe was not found."

            echo ""
            echo "Available OpenJDK recipes:"

            find termux-packages/packages \
              -maxdepth 2 \
              -type f \
              -name "build.sh" \
              | grep -i openjdk \
              || true

            exit 1
          fi

          echo ""
          echo "Recipe found:"
          echo "$RECIPE"

          echo ""
          echo "Recipe:"
          sed -n '1,280p' "$RECIPE"


      # ============================================================
      # 9. SET BUILD ENVIRONMENT
      # ============================================================

      - name: Setup build environment
        shell: bash
        run: |

          set -e

          # --------------------------------------------------------
          # Java 17
          # --------------------------------------------------------

          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"

          export JAVA_HOME="$JAVA17"

          # --------------------------------------------------------
          # Termux architecture
          # --------------------------------------------------------

          export TERMUX_ARCH=aarch64

          # --------------------------------------------------------
          # Termux package build flags
          # --------------------------------------------------------

          export TERMUX_FORCE_BUILD=true

          # --------------------------------------------------------
          # Save environment for following steps
          # --------------------------------------------------------

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"

          echo "TERMUX_ARCH=aarch64" >> "$GITHUB_ENV"

          echo "TERMUX_FORCE_BUILD=true" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "Java:"
          "$JAVA_HOME/bin/java" -version


      # ============================================================
      # 10. BUILD OPENJDK 17
      # ============================================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e
          set -o pipefail

          cd termux-packages

          export TERMUX_ARCH=aarch64

          export TERMUX_FORCE_BUILD=true

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          export PATH="$JAVA_HOME/bin:$PATH"

          echo ""
          echo "=========================================="
          echo "BUILD ANDROID OPENJDK 17"
          echo "=========================================="

          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "Starting build..."

          # --------------------------------------------------------
          # Build
          # --------------------------------------------------------

          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ============================================================
      # 11. FIND GENERATED PACKAGE
      # ============================================================

      - name: Find OpenJDK package
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "SEARCHING FOR OPENJDK PACKAGE"
          echo "=========================================="

          echo ""
          echo "DEB files:"

          find termux-packages \
            -type f \
            -name "*.deb" \
            -print \
            | grep -i openjdk \
            || true

          echo ""
          echo "All OpenJDK files:"

          find termux-packages \
            -type f \
            -iname "*openjdk*" \
            -print \
            | head -200 \
            || true


      # ============================================================
      # 12. EXTRACT JDK FROM DEB
      # ============================================================

      - name: Extract JDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "EXTRACTING OPENJDK 17"
          echo "=========================================="

          rm -rf output
          rm -rf extracted-jdk

          mkdir -p output/jdk-17
          mkdir -p extracted-jdk

          # --------------------------------------------------------
          # Find generated OpenJDK package
          # --------------------------------------------------------

          DEB=$(find termux-packages \
            -type f \
            -name "*.deb" \
            -iname "*openjdk*17*" \
            -print \
            | head -1)

          if [ -z "$DEB" ]; then

            echo ""
            echo "ERROR: OpenJDK 17 DEB not found."

            echo ""
            echo "Available DEB files:"

            find termux-packages \
              -type f \
              -name "*.deb" \
              -print \
              || true

            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$DEB"


          # --------------------------------------------------------
          # Extract DEB
          # --------------------------------------------------------

          dpkg-deb \
            -x "$DEB" \
            extracted-jdk


          echo ""
          echo "Extracted files:"

          find extracted-jdk \
            -maxdepth 5 \
            -type d \
            | head -100


          # --------------------------------------------------------
          # Find Java 17
          # --------------------------------------------------------

          JDK_DIR=$(find extracted-jdk \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print \
            -quit)


          # --------------------------------------------------------
          # Alternative path
          # --------------------------------------------------------

          if [ -z "$JDK_DIR" ]; then

            JDK_DIR=$(find extracted-jdk \
              -type d \
              -path "*/lib/jvm/*17*" \
              -print \
              -quit)

          fi


          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: JDK directory not found."

            echo ""
            echo "Searching for java executable:"

            find extracted-jdk \
              -type f \
              -name java \
              -print \
              || true

            exit 1
          fi


          echo ""
          echo "JDK directory:"
          echo "$JDK_DIR"


          # --------------------------------------------------------
          # Copy
          # --------------------------------------------------------

          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


          echo ""
          echo "Standalone JDK created."

          ls -lah output/jdk-17


      # ============================================================
      # 13. CLEAN JDK
      # ============================================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "CLEANING JDK"
          echo "=========================================="

          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include" \
            "$JDK/share/doc" \
            "$JDK/share/man"


          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o \
              -name "*.debug" \
            \) \
            -delete


          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;


          echo "JDK cleaned."


      # ============================================================
      # 14. FIX EXECUTABLE PERMISSIONS
      # ============================================================

      - name: Fix executable permissions
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          if [ ! -d "$JDK/bin" ]; then

            echo "ERROR: JDK bin directory missing."

            exit 1

          fi

          chmod +x "$JDK/bin/"* || true

          echo ""
          echo "Java:"
          ls -lh "$JDK/bin/java"

          echo ""
          echo "Javac:"
          ls -lh "$JDK/bin/javac"


      # ============================================================
      # 15. VERIFY JDK
      # ============================================================

      - name: Verify JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "VERIFYING JDK"
          echo "=========================================="

          test -f "$JDK/bin/java"

          test -f "$JDK/bin/javac"

          test -d "$JDK/lib"

          echo ""
          echo "JDK structure OK."


          echo ""
          echo "Java binary:"
          file "$JDK/bin/java"


          echo ""
          echo "Javac binary:"
          file "$JDK/bin/javac"


          echo ""
          echo "JDK files:"
          find "$JDK/bin" \
            -maxdepth 1 \
            -type f \
            -print


      # ============================================================
      # 16. CREATE INFO FILE
      # ============================================================

      - name: Create JDK information
        shell: bash
        run: |

          set -e

          cat > output/jdk-17/ANDROIDJDK_INFO.txt <<EOF
AndroidJDK

Distribution: SgmApp AndroidJDK
Java Version: OpenJDK 17
Architecture: ARM64 / AArch64
Platform: Android / Termux

Repository:
https://github.com/SgmApp/AndroidJDK
EOF


      # ============================================================
      # 17. CREATE ZIP
      # ============================================================

      - name: Create ARM64 ZIP
        shell: bash
        run: |

          set -e

          rm -f \
            android-jdk17-arm64.zip

          cd output

          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17

          cd ..

          echo ""
          echo "=========================================="
          echo "ZIP CREATED"
          echo "=========================================="

          ls -lh \
            android-jdk17-arm64.zip


      # ============================================================
      # 18. TEST ZIP
      # ============================================================

      - name: Test ZIP
        shell: bash
        run: |

          set -e

          unzip -t \
            android-jdk17-arm64.zip

          echo ""
          echo "ZIP test successful."


      # ============================================================
      # 19. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e

          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256

          echo ""
          echo "SHA256:"
          cat android-jdk17-arm64.zip.sha256


      # ============================================================
      # 20. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4
        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 21. CREATE RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
