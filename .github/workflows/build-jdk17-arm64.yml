name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    name: Android OpenJDK 17 - ARM64

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TERMUX_ARCH: aarch64

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ==========================================================
      # 2. INSTALL HOST DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALLING HOST DEPENDENCIES"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            ca-certificates \
            bison \
            flex \
            gawk \
            gettext \
            python3 \
            python3-pip \
            python3-venv

          echo ""
          echo "Host dependencies installed."


      # ==========================================================
      # 3. INSTALL JAVA 17
      # ==========================================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "INSTALLING JAVA 17"
          echo "=========================================="

          sudo apt-get install -y openjdk-17-jdk

          echo ""
          echo "Available Java installations:"

          update-alternatives --list java || true

          echo ""
          echo "Available Javac installations:"

          update-alternatives --list javac || true


          # ------------------------------------------------------
          # Force Java 17
          # ------------------------------------------------------

          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"

          if [ ! -d "$JAVA17" ]; then

            echo ""
            echo "ERROR: Java 17 directory not found."

            ls -la /usr/lib/jvm/

            exit 1

          fi


          sudo update-alternatives \
            --set java \
            "$JAVA17/bin/java"

          sudo update-alternatives \
            --set javac \
            "$JAVA17/bin/javac"


          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"

          echo "$JAVA17/bin" >> "$GITHUB_PATH"


          echo ""
          echo "=========================================="
          echo "JAVA VERSION"
          echo "=========================================="

          "$JAVA17/bin/java" -version

          "$JAVA17/bin/javac" -version


      # ==========================================================
      # 4. CLONE TERMUX PACKAGES
      # ==========================================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "CLONING TERMUX PACKAGES"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          cd termux-packages

          echo ""
          echo "Termux commit:"

          git rev-parse HEAD


      # ==========================================================
      # 5. PREPARE TERMUX BUILD PATHS
      # ==========================================================

      - name: Prepare Termux build environment
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "PREPARING TERMUX BUILD ENVIRONMENT"
          echo "=========================================="


          # ------------------------------------------------------
          # IMPORTANT
          #
          # Current Termux build scripts may access:
          #
          # /data/TERMUX_ARCH
          #
          # GitHub Actions does not normally have this directory.
          # Create it before starting the build.
          # ------------------------------------------------------

          sudo mkdir -p /data

          echo "aarch64" | sudo tee /data/TERMUX_ARCH > /dev/null

          sudo chmod 666 /data/TERMUX_ARCH


          # ------------------------------------------------------
          # Also create a safe TERMUX_ARCH state
          # ------------------------------------------------------

          export TERMUX_ARCH=aarch64

          echo "TERMUX_ARCH=aarch64" >> "$GITHUB_ENV"


          echo ""
          echo "TERMUX_ARCH:"
          cat /data/TERMUX_ARCH


          echo ""
          echo "Permissions:"

          ls -lh /data/TERMUX_ARCH


      # ==========================================================
      # 6. SETUP TERMUX UBUNTU ENVIRONMENT
      # ==========================================================

      - name: Setup Termux Ubuntu environment
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "TERMUX UBUNTU SETUP"
          echo "=========================================="


          if [ -f scripts/setup-ubuntu.sh ]; then

            chmod +x scripts/setup-ubuntu.sh

            ./scripts/setup-ubuntu.sh

          else

            echo "setup-ubuntu.sh not found."
            echo "Continuing..."

          fi


      # ==========================================================
      # 7. SETUP ANDROID SDK + NDK
      # ==========================================================

      - name: Setup Android SDK and NDK
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "ANDROID SDK + NDK SETUP"
          echo "=========================================="


          chmod +x scripts/setup-android-sdk.sh

          ./scripts/setup-android-sdk.sh


          echo ""
          echo "SDK/NDK setup finished."


      # ==========================================================
      # 8. DETECT SDK
      # ==========================================================

      - name: Detect Android SDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "DETECT ANDROID SDK"
          echo "=========================================="


          echo ""
          echo "HOME/lib:"

          ls -la "$HOME/lib" || true


          SDK=""


          if [ -d "$HOME/lib/android-sdk-35" ]; then

            SDK="$HOME/lib/android-sdk-35"

          elif [ -d "$HOME/lib/android-sdk" ]; then

            SDK="$HOME/lib/android-sdk"

          else

            SDK=$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name "android-sdk*" \
              -print -quit \
              2>/dev/null || true)

          fi


          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then

            echo ""
            echo "ERROR: Android SDK not found."

            echo ""
            echo "Searching:"

            find "$HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "SDK found:"
          echo "$SDK"


          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"


      # ==========================================================
      # 9. DETECT NDK
      # ==========================================================

      - name: Detect Android NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "DETECT ANDROID NDK"
          echo "=========================================="


          NDK=""


          if [ -d "$HOME/lib/android-ndk-r29" ]; then

            NDK="$HOME/lib/android-ndk-r29"

          else

            NDK=$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name "android-ndk-*" \
              -print -quit \
              2>/dev/null || true)

          fi


          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then

            echo ""
            echo "ERROR: Android NDK not found."

            echo ""
            echo "Searching:"

            find "$HOME/lib" \
              -maxdepth 2 \
              -type d \
              -iname "*ndk*" \
              -print \
              2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "NDK found:"
          echo "$NDK"


          echo "NDK=$NDK" >> "$GITHUB_ENV"


      # ==========================================================
      # 10. CONFIGURE ENVIRONMENT
      # ==========================================================

      - name: Configure Android build environment
        shell: bash
        run: |

          set -e

          JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"


          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"

          echo "$JAVA17/bin" >> "$GITHUB_PATH"


          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


          echo ""
          echo "NDK:"
          echo "$NDK"


          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"


      # ==========================================================
      # 11. VERIFY JAVA
      # ==========================================================

      - name: Verify Java 17
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY JAVA 17"
          echo "=========================================="


          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          export PATH="$JAVA_HOME/bin:$PATH"


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "java path:"

          which java


          echo ""
          echo "Java version:"

          java -version


          echo ""
          echo "javac path:"

          which javac


          echo ""
          echo "Javac version:"

          javac -version


          # ------------------------------------------------------
          # Ensure Java 17, NOT Java 11
          # ------------------------------------------------------

          JAVA_VERSION=$(java -version 2>&1 | head -n 1)


          if ! echo "$JAVA_VERSION" | grep -q '"17'; then

            echo ""
            echo "ERROR: Java 17 is NOT active."

            echo "$JAVA_VERSION"

            exit 1

          fi


          echo ""
          echo "Java 17 verification successful."


      # ==========================================================
      # 12. VERIFY SDK
      # ==========================================================

      - name: Verify Android SDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID SDK"
          echo "=========================================="


          if [ ! -d "$ANDROID_HOME" ]; then

            echo ""
            echo "ERROR: SDK not found:"
            echo "$ANDROID_HOME"

            exit 1

          fi


          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -print -quit \
            2>/dev/null || true)


          if [ -z "$SDKMANAGER" ]; then

            echo ""
            echo "WARNING: sdkmanager not found."

          else

            echo ""
            echo "sdkmanager:"
            echo "$SDKMANAGER"

            chmod +x "$SDKMANAGER" || true

          fi


          echo ""
          echo "SDK exists."


      # ==========================================================
      # 13. VERIFY NDK
      # ==========================================================

      - name: Verify Android NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID NDK"
          echo "=========================================="


          if [ ! -d "$NDK" ]; then

            echo ""
            echo "ERROR: NDK does not exist:"
            echo "$NDK"

            exit 1

          fi


          if [ ! -f "$NDK/source.properties" ]; then

            echo ""
            echo "ERROR: source.properties missing."

            exit 1

          fi


          echo ""
          echo "NDK:"
          echo "$NDK"


          echo ""
          echo "NDK version:"

          cat "$NDK/source.properties"


          echo ""
          echo "NDK verification successful."


      # ==========================================================
      # 14. CHECK OPENJDK RECIPE
      # ==========================================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          RECIPE="termux-packages/packages/openjdk-17/build.sh"


          echo "=========================================="
          echo "CHECK OPENJDK 17 RECIPE"
          echo "=========================================="


          if [ ! -f "$RECIPE" ]; then

            echo ""
            echo "ERROR: Recipe not found:"
            echo "$RECIPE"

            exit 1

          fi


          echo ""
          echo "Recipe found."


          sed -n '1,280p' "$RECIPE"


      # ==========================================================
      # 15. FINAL BUILD ENVIRONMENT
      # ==========================================================

      - name: Final build environment check
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "FINAL BUILD ENVIRONMENT"
          echo "=========================================="


          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"


          echo ""
          echo "Architecture file:"
          cat /data/TERMUX_ARCH


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          echo ""
          echo "NDK:"
          echo "$NDK"


          echo ""
          echo "Java:"
          java -version


          echo ""
          echo "Javac:"
          javac -version


          echo ""
          echo "NDK exists:"
          test -d "$NDK"


          echo ""
          echo "All environment checks passed."


      # ==========================================================
      # 16. BUILD OPENJDK 17 ARM64
      # ==========================================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e
          set -o pipefail


          cd termux-packages


          # ------------------------------------------------------
          # IMPORTANT ENVIRONMENT
          # ------------------------------------------------------

          export TERMUX_ARCH=aarch64

          export TERMUX_FORCE_BUILD=true

          export TERMUX_INSTALL_DEPS=true


          export ANDROID_HOME="$HOME/lib/android-sdk-35"

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export NDK="$HOME/lib/android-ndk-r29"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          export PATH="$JAVA_HOME/bin:$PATH"


          # ------------------------------------------------------
          # Make architecture state available to Termux scripts
          # ------------------------------------------------------

          sudo mkdir -p /data

          echo "aarch64" | sudo tee /data/TERMUX_ARCH > /dev/null

          sudo chmod 666 /data/TERMUX_ARCH


          echo ""
          echo "=========================================="
          echo "BUILD ANDROID OPENJDK 17"
          echo "=========================================="


          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"


          echo ""
          echo "Architecture file:"
          cat /data/TERMUX_ARCH


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "Java:"
          java -version


          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          echo ""
          echo "NDK:"
          echo "$NDK"


          echo ""
          echo "Starting build..."


          # ------------------------------------------------------
          # BUILD
          # ------------------------------------------------------

          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ==========================================================
      # 17. LOCATE GENERATED PACKAGE
      # ==========================================================

      - name: Locate generated OpenJDK package
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "LOCATE OPENJDK OUTPUT"
          echo "=========================================="


          echo ""
          echo "DEB files:"

          find termux-packages \
            -type f \
            -name "*.deb" \
            -print \
            | grep -Ei "openjdk|jdk|java" \
            || true


          echo ""
          echo "JDK directories:"

          find termux-packages \
            -type d \
            -path "*/lib/jvm/*" \
            -print \
            || true


      # ==========================================================
      # 18. PREPARE STANDALONE JDK
      # ==========================================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "PREPARE STANDALONE JDK"
          echo "=========================================="


          rm -rf output

          mkdir -p output/jdk-17


          # ------------------------------------------------------
          # Search generated package
          # ------------------------------------------------------

          DEB=$(find termux-packages \
            -type f \
            -name "*.deb" \
            -print \
            | grep -Ei "openjdk|jdk" \
            | head -n 1 \
            || true)


          if [ -z "$DEB" ]; then

            echo ""
            echo "ERROR: OpenJDK DEB not found."

            echo ""
            echo "Available DEB packages:"

            find termux-packages \
              -type f \
              -name "*.deb" \
              -print \
              || true

            exit 1

          fi


          echo ""
          echo "OpenJDK package:"
          echo "$DEB"


          # ------------------------------------------------------
          # Extract DEB
          # ------------------------------------------------------

          rm -rf extracted-jdk

          mkdir -p extracted-jdk


          dpkg-deb \
            -x "$DEB" \
            extracted-jdk


          echo ""
          echo "Extracted package."


          # ------------------------------------------------------
          # Locate JDK
          # ------------------------------------------------------

          JDK_DIR=$(find extracted-jdk \
            -type d \
            -path "*/lib/jvm/*" \
            -print \
            | head -n 1 \
            || true)


          # ------------------------------------------------------
          # Fallback: locate java binary
          # ------------------------------------------------------

          if [ -z "$JDK_DIR" ]; then

            JAVA_BIN=$(find extracted-jdk \
              -type f \
              -path "*/bin/java" \
              -print \
              | head -n 1 \
              || true)


            if [ -n "$JAVA_BIN" ]; then

              JDK_DIR="${JAVA_BIN%/bin/java}"

            fi

          fi


          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: JDK directory could not be located."

            echo ""
            echo "Extracted files:"

            find extracted-jdk \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1

          fi


          echo ""
          echo "JDK directory:"
          echo "$JDK_DIR"


          # ------------------------------------------------------
          # Copy JDK
          # ------------------------------------------------------

          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


          echo ""
          echo "Standalone JDK prepared."


      # ==========================================================
      # 19. CHECK JDK
      # ==========================================================

      - name: Check JDK structure
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          echo "=========================================="
          echo "CHECK JDK STRUCTURE"
          echo "=========================================="


          if [ ! -f "$JDK/bin/java" ]; then

            echo "ERROR: bin/java missing."

            exit 1

          fi


          if [ ! -f "$JDK/bin/javac" ]; then

            echo "ERROR: bin/javac missing."

            exit 1

          fi


          echo ""
          echo "java:"
          ls -lh "$JDK/bin/java"


          echo ""
          echo "javac:"
          ls -lh "$JDK/bin/javac"


          echo ""
          echo "JDK structure OK."


      # ==========================================================
      # 20. CLEAN JDK
      # ==========================================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          echo "=========================================="
          echo "CLEAN JDK"
          echo "=========================================="


          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include"


          rm -rf \
            "$JDK/share/doc" \
            "$JDK/share/man"


          find "$JDK" \
            -type f \
            \( \
              -name "*.debug" \
              -o \
              -name "*.debuginfo" \
            \) \
            -delete


          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;


          echo ""
          echo "JDK cleaned."


      # ==========================================================
      # 21. FIX PERMISSIONS
      # ==========================================================

      - name: Fix executable permissions
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          chmod +x \
            "$JDK/bin/"* \
            2>/dev/null \
            || true


          echo ""
          echo "java:"
          ls -lh "$JDK/bin/java"


          echo ""
          echo "javac:"
          ls -lh "$JDK/bin/javac"


      # ==========================================================
      # 22. VERIFY ARM64
      # ==========================================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"


          echo "=========================================="
          echo "VERIFY ARM64"
          echo "=========================================="


          echo ""
          echo "java:"
          file "$JDK/bin/java"


          echo ""
          echo "javac:"
          file "$JDK/bin/javac"


          echo ""
          echo "Checking ARM64..."


          if ! file "$JDK/bin/java" | grep -Eiq \
            "aarch64|arm64|ARM aarch64"; then

            echo ""
            echo "ERROR: java is not ARM64."

            file "$JDK/bin/java"

            exit 1

          fi


          echo ""
          echo "ARM64 verification successful."


      # ==========================================================
      # 23. CREATE INFO FILE
      # ==========================================================

      - name: Create AndroidJDK info
        shell: bash
        run: |

          set -e

          cat > output/jdk-17/ANDROIDJDK_INFO.txt <<'EOF'
AndroidJDK
==========

Distribution:
SgmApp AndroidJDK

Java:
OpenJDK 17

Architecture:
ARM64 / AArch64

Platform:
Android / Termux Bionic

Repository:
https://github.com/SgmApp/AndroidJDK
EOF


      # ==========================================================
      # 24. CREATE ZIP
      # ==========================================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e


          echo "=========================================="
          echo "CREATE JDK ZIP"
          echo "=========================================="


          rm -f android-jdk17-arm64.zip


          cd output


          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17


          cd ..


          echo ""
          echo "ZIP created:"


          ls -lh \
            android-jdk17-arm64.zip


      # ==========================================================
      # 25. TEST ZIP
      # ==========================================================

      - name: Test JDK ZIP
        shell: bash
        run: |

          set -e


          echo "=========================================="
          echo "TEST JDK ZIP"
          echo "=========================================="


          unzip -t \
            android-jdk17-arm64.zip


          echo ""
          echo "ZIP test successful."


      # ==========================================================
      # 26. SHA256
      # ==========================================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e


          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256


          echo ""
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="


          cat android-jdk17-arm64.zip.sha256


      # ==========================================================
      # 27. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4

        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================================
      # 28. CREATE GITHUB RELEASE
      # ==========================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
