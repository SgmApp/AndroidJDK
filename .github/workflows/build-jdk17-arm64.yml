name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    name: Android OpenJDK 17 - ARM64

    runs-on: ubuntu-22.04

    env:
      TERMUX_ARCH: aarch64

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================

      - name: Install build dependencies
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            ca-certificates

          echo ""
          echo "=========================================="
          echo "System dependencies installed"
          echo "=========================================="


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          sudo apt-get install -y openjdk-17-jdk

          sudo update-alternatives \
            --install /usr/bin/java java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java 1711

          sudo update-alternatives \
            --install /usr/bin/javac javac \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/javac 1711

          sudo update-alternatives \
            --set java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java

          sudo update-alternatives \
            --set javac \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "Java 17"
          echo "=========================================="

          java -version

          javac -version


      # ==========================================
      # CLONE TERMUX PACKAGES
      # ==========================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          echo ""
          echo "=========================================="
          echo "Termux packages cloned"
          echo "=========================================="

          cd termux-packages

          git rev-parse HEAD


      # ==========================================
      # SETUP ANDROID SDK + NDK
      # ==========================================

      - name: Setup Android SDK and NDK
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo ""
          echo "=========================================="
          echo "Setting up Android SDK + NDK"
          echo "=========================================="

          chmod +x scripts/setup-android-sdk.sh

          ./scripts/setup-android-sdk.sh

          echo ""
          echo "=========================================="
          echo "SDK / NDK setup finished"
          echo "=========================================="


      # ==========================================
      # VERIFY ANDROID NDK
      # ==========================================

      - name: Verify Android NDK r29
        shell: bash
        run: |

          set -e

          NDK_DIR="$HOME/lib/android-ndk-r29"

          echo ""
          echo "=========================================="
          echo "Checking Android NDK r29"
          echo "=========================================="

          echo "Expected:"
          echo "$NDK_DIR"

          if [ ! -d "$NDK_DIR" ]; then
            echo "ERROR: Android NDK r29 was not installed."
            exit 1
          fi

          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "ERROR: source.properties missing."
            exit 1
          fi

          cat "$NDK_DIR/source.properties"

          echo ""
          echo "NDK r29 OK."


      # ==========================================
      # CONFIGURE ENVIRONMENT
      # ==========================================

      - name: Configure Android build environment
        shell: bash
        run: |

          set -e

          echo "ANDROID_HOME=$HOME/lib/android-sdk-35" >> "$GITHUB_ENV"

          echo "ANDROID_SDK_ROOT=$HOME/lib/android-sdk-35" >> "$GITHUB_ENV"

          echo "NDK=$HOME/lib/android-ndk-r29" >> "$GITHUB_ENV"

          echo "TERMUX_ARCH=aarch64" >> "$GITHUB_ENV"

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"

          echo "$HOME/lib/android-sdk-35/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "$HOME/lib/android-sdk-35/platform-tools" >> "$GITHUB_PATH"

          echo "$HOME/lib/android-sdk-35/build-tools/35.0.0" >> "$GITHUB_PATH"

          echo ""
          echo "=========================================="
          echo "Environment configured"
          echo "=========================================="


      # ==========================================
      # VERIFY ENVIRONMENT
      # ==========================================

      - name: Verify build environment
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "Checking NDK..."

          test -d "$NDK"

          echo "NDK exists."


      # ==========================================
      # CHECK OPENJDK 17 RECIPE
      # ==========================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          test -f \
            termux-packages/packages/openjdk-17/build.sh

          echo ""
          echo "=========================================="
          echo "OpenJDK 17 recipe found"
          echo "=========================================="

          sed -n '1,260p' \
            termux-packages/packages/openjdk-17/build.sh


      # ==========================================
      # BUILD OPENJDK 17 ARM64
      # ==========================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e

          cd termux-packages

          export TERMUX_ARCH=aarch64
          export TERMUX_FORCE_BUILD=true
          export TERMUX_INSTALL_DEPS=true

          echo ""
          echo "=========================================="
          echo "Android OpenJDK 17 ARM64"
          echo "=========================================="

          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "Host Java:"
          java -version

          echo ""
          echo "Starting Termux Docker build..."

          chmod +x scripts/run-docker.sh

          ./scripts/run-docker.sh \
            ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17

          echo ""
          echo "=========================================="
          echo "Termux build completed"
          echo "=========================================="


      # ==========================================
      # LOCATE GENERATED PACKAGE
      # ==========================================

      - name: Locate OpenJDK package
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Searching for OpenJDK 17 package"
          echo "=========================================="

          echo ""
          echo "Searching entire Termux tree..."

          find termux-packages \
            -type f \
            \( \
              -name "*openjdk*17*.deb" \
              -o \
              -name "*openjdk*17*.tar*" \
            \) \
            -print || true

          PACKAGE=$(find termux-packages \
            -type f \
            -name "*openjdk*17*.deb" \
            -print -quit)

          if [ -z "$PACKAGE" ]; then

            echo ""
            echo "ERROR: OpenJDK 17 package was not generated."

            echo ""
            echo "Searching output directories..."

            find termux-packages \
              -maxdepth 6 \
              -type f \
              -name "*.deb" \
              -print || true

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "OpenJDK package found"
          echo "=========================================="

          echo "$PACKAGE"

          cp "$PACKAGE" "$GITHUB_WORKSPACE/openjdk-17-arm64.deb"

          echo ""
          echo "Copied package:"
          ls -lh "$GITHUB_WORKSPACE/openjdk-17-arm64.deb"


      # ==========================================
      # PREPARE STANDALONE JDK
      # ==========================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Preparing standalone JDK"
          echo "=========================================="

          rm -rf output
          rm -rf extracted-jdk

          mkdir -p output/jdk-17
          mkdir -p extracted-jdk

          echo ""
          echo "Extracting package..."

          dpkg-deb -x \
            openjdk-17-arm64.deb \
            extracted-jdk

          echo ""
          echo "Searching for Java..."

          JDK_BIN=$(find extracted-jdk \
            -type f \
            -path "*/bin/java" \
            -print -quit)

          if [ -z "$JDK_BIN" ]; then

            echo ""
            echo "ERROR: bin/java not found."

            echo ""
            echo "Extracted directory:"

            find extracted-jdk \
              -maxdepth 8 \
              -type f \
              | head -300 || true

            exit 1

          fi

          echo ""
          echo "Java binary:"
          echo "$JDK_BIN"

          JDK_DIR=$(dirname "$JDK_BIN")
          JDK_DIR=$(dirname "$JDK_DIR")

          echo ""
          echo "Detected JDK:"
          echo "$JDK_DIR"

          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/

          echo ""
          echo "JDK copied successfully."


      # ==========================================
      # CHECK JDK STRUCTURE
      # ==========================================

      - name: Check JDK structure
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo ""
          echo "=========================================="
          echo "JDK STRUCTURE"
          echo "=========================================="

          find "$JDK" \
            -maxdepth 3 \
            -type d \
            -print | head -150

          echo ""

          if [ ! -f "$JDK/bin/java" ]; then
            echo "ERROR: bin/java missing."
            exit 1
          fi

          if [ ! -f "$JDK/bin/javac" ]; then
            echo "ERROR: bin/javac missing."
            exit 1
          fi

          echo "Java:"
          ls -lh "$JDK/bin/java"

          echo ""
          echo "Javac:"
          ls -lh "$JDK/bin/javac"


      # ==========================================
      # CLEAN JDK
      # ==========================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo ""
          echo "=========================================="
          echo "Cleaning JDK"
          echo "=========================================="

          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include"

          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o \
              -name "*.debug" \
            \) \
            -delete

          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;

          echo ""
          echo "JDK cleaned."


      # ==========================================
      # FIX EXECUTABLE PERMISSIONS
      # ==========================================

      - name: Fix executable permissions
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          find "$JDK/bin" \
            -type f \
            -exec chmod +x {} \;

          echo ""
          echo "Executable permissions fixed."

          ls -lh "$JDK/bin/java"
          ls -lh "$JDK/bin/javac"


      # ==========================================
      # VERIFY ARM64
      # ==========================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo ""
          echo "=========================================="
          echo "VERIFYING ARM64"
          echo "=========================================="

          JAVA_REAL=$(readlink -f "$JDK/bin/java")
          JAVAC_REAL=$(readlink -f "$JDK/bin/javac")

          echo ""
          echo "java:"
          file "$JAVA_REAL"

          echo ""
          echo "javac:"
          file "$JAVAC_REAL"

          echo ""
          echo "Expected:"
          echo "ARM aarch64"

          if ! file "$JAVA_REAL" | grep -Ei \
            "aarch64|ARM aarch64|ARM64"; then

            echo ""
            echo "ERROR: java binary is not ARM64."

            exit 1

          fi

          if ! file "$JAVAC_REAL" | grep -Ei \
            "aarch64|ARM aarch64|ARM64"; then

            echo ""
            echo "ERROR: javac binary is not ARM64."

            exit 1

          fi

          echo ""
          echo "ARM64 verification successful."


      # ==========================================
      # CREATE ZIP
      # ==========================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Creating ZIP"
          echo "=========================================="

          rm -f android-jdk17-arm64.zip

          cd output

          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17

          cd ..

          if [ ! -f android-jdk17-arm64.zip ]; then

            echo ""
            echo "ERROR: ZIP was not created."

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "ZIP CREATED"
          echo "=========================================="

          ls -lh android-jdk17-arm64.zip


      # ==========================================
      # TEST ZIP
      # ==========================================

      - name: Test ZIP
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Testing ZIP"
          echo "=========================================="

          if [ ! -f android-jdk17-arm64.zip ]; then
            echo "ERROR: ZIP file missing."
            exit 1
          fi

          unzip -t \
            android-jdk17-arm64.zip

          echo ""
          echo "ZIP test successful."


      # ==========================================
      # GENERATE SHA256
      # ==========================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e

          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256

          echo ""
          echo "=========================================="
          echo "SHA256"
          echo "=========================================="

          cat android-jdk17-arm64.zip.sha256


      # ==========================================
      # VERIFY FINAL FILES
      # ==========================================

      - name: Verify final files
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "FINAL FILES"
          echo "=========================================="

          test -f android-jdk17-arm64.zip

          test -f android-jdk17-arm64.zip.sha256

          echo ""
          echo "ZIP:"
          ls -lh android-jdk17-arm64.zip

          echo ""
          echo "SHA256:"
          ls -lh android-jdk17-arm64.zip.sha256

          echo ""
          echo "Files ready."


      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================

      - name: Upload JDK ZIP artifact
        uses: actions/upload-artifact@v4
        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          if-no-files-found: error

          retention-days: 30


      # ==========================================
      # CREATE GITHUB RELEASE
      # ==========================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
