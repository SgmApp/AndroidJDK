name: Build Android OpenJDK 17 ARM64

on:

  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write


jobs:

  build:

    name: Android OpenJDK 17 - ARM64

    runs-on: ubuntu-22.04

    env:
      TERMUX_ARCH: aarch64

    steps:


      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ==================================================
      # INSTALL SYSTEM DEPENDENCIES
      # ==================================================

      - name: Install build dependencies
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Installing build dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            ca-certificates \
            gnupg

          echo ""
          echo "Dependencies installed."


      # ==================================================
      # INSTALL JAVA 17
      # ==================================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Installing Java 17"
          echo "=========================================="

          sudo apt-get install -y \
            openjdk-17-jdk

          echo ""
          echo "Installed JVM directories:"

          ls -la /usr/lib/jvm/


      # ==================================================
      # CONFIGURE JAVA 17
      # ==================================================

      - name: Configure Java 17
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Configuring Java 17"
          echo "=========================================="

          JAVA17=""

          if [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then

            JAVA17="/usr/lib/jvm/java-17-openjdk-amd64"

          fi


          if [ -z "$JAVA17" ]; then

            JAVA17=$(find /usr/lib/jvm \
              -maxdepth 1 \
              -type d \
              -name "*17*" \
              -print -quit)

          fi


          if [ -z "$JAVA17" ]; then

            echo ""
            echo "ERROR: Java 17 not found."

            exit 1

          fi


          echo ""
          echo "Java 17 directory:"
          echo "$JAVA17"


          # ==========================================
          # GITHUB ENVIRONMENT
          # ==========================================

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"

          echo "$JAVA17/bin" >> "$GITHUB_PATH"


          # ==========================================
          # JAVA ALTERNATIVES
          # ==========================================

          sudo update-alternatives \
            --install \
            /usr/bin/java \
            java \
            "$JAVA17/bin/java" \
            1717


          sudo update-alternatives \
            --install \
            /usr/bin/javac \
            javac \
            "$JAVA17/bin/javac" \
            1717


          sudo update-alternatives \
            --set \
            java \
            "$JAVA17/bin/java"


          sudo update-alternatives \
            --set \
            javac \
            "$JAVA17/bin/javac"


          # ==========================================
          # VERIFY
          # ==========================================

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java:"

          java -version

          echo ""
          echo "Javac:"

          javac -version


      # ==================================================
      # CLONE TERMUX PACKAGES
      # ==================================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          echo ""
          echo "=========================================="
          echo "Cloning Termux packages"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages


          cd termux-packages


          echo ""
          echo "Termux commit:"

          git rev-parse HEAD


      # ==================================================
      # SETUP ANDROID SDK + NDK
      # ==================================================

      - name: Setup Android SDK and NDK
        shell: bash
        run: |

          set -e

          cd termux-packages


          echo ""
          echo "=========================================="
          echo "Setting up Android SDK and NDK"
          echo "=========================================="


          chmod +x \
            scripts/setup-android-sdk.sh


          ./scripts/setup-android-sdk.sh


          echo ""
          echo "Android SDK / NDK setup completed."


      # ==================================================
      # VERIFY SDK
      # ==================================================

      - name: Verify Android SDK
        shell: bash
        run: |

          set -e


          SDK="$HOME/lib/android-sdk-35"


          echo ""
          echo "=========================================="
          echo "VERIFY ANDROID SDK"
          echo "=========================================="


          echo ""
          echo "SDK:"
          echo "$SDK"


          if [ ! -d "$SDK" ]; then

            echo ""
            echo "ERROR: Android SDK not found."

            exit 1

          fi


          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then

            SDKMANAGER="$SDK/cmdline-tools/bin/sdkmanager"

          else

            echo ""
            echo "ERROR: sdkmanager not found."

            find "$SDK" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi


          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"


      # ==================================================
      # VERIFY NDK
      # ==================================================

      - name: Verify Android NDK r29
        shell: bash
        run: |

          set -e


          NDK_DIR="$HOME/lib/android-ndk-r29"


          echo ""
          echo "=========================================="
          echo "VERIFY ANDROID NDK r29"
          echo "=========================================="


          echo ""
          echo "NDK:"
          echo "$NDK_DIR"


          if [ ! -d "$NDK_DIR" ]; then

            echo ""
            echo "ERROR: Android NDK r29 not found."

            exit 1

          fi


          if [ ! -f "$NDK_DIR/source.properties" ]; then

            echo ""
            echo "ERROR: source.properties missing."

            exit 1

          fi


          echo ""
          echo "NDK source.properties:"

          cat "$NDK_DIR/source.properties"


          echo ""
          echo "NDK verified."


      # ==================================================
      # CONFIGURE ANDROID ENVIRONMENT
      # ==================================================

      - name: Configure Android environment
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "Configuring Android environment"
          echo "=========================================="


          echo "ANDROID_HOME=$HOME/lib/android-sdk-35" \
            >> "$GITHUB_ENV"


          echo "ANDROID_SDK_ROOT=$HOME/lib/android-sdk-35" \
            >> "$GITHUB_ENV"


          echo "NDK=$HOME/lib/android-ndk-r29" \
            >> "$GITHUB_ENV"


          echo "TERMUX_ARCH=aarch64" \
            >> "$GITHUB_ENV"


          echo "TERMUX_FORCE_BUILD=true" \
            >> "$GITHUB_ENV"


          echo "TERMUX_INSTALL_DEPS=true" \
            >> "$GITHUB_ENV"


          echo ""
          echo "Android environment configured."


      # ==================================================
      # CREATE TERMUX ARCH FILE
      # ==================================================

      - name: Configure Termux ARM64 architecture
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "Configuring TERMUX_ARCH"
          echo "=========================================="


          # Termux build script expects this file
          # on this build environment.

          sudo mkdir -p /data


          echo "aarch64" | \
            sudo tee /data/TERMUX_ARCH \
            > /dev/null


          sudo chmod 644 \
            /data/TERMUX_ARCH


          echo ""
          echo "TERMUX_ARCH file:"

          cat /data/TERMUX_ARCH


          echo ""
          echo "TERMUX_ARCH environment:"

          echo "$TERMUX_ARCH"


      # ==================================================
      # VERIFY COMPLETE BUILD ENVIRONMENT
      # ==================================================

      - name: Verify build environment
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"


          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"


          echo ""
          echo "NDK:"
          echo "$NDK"


          echo ""
          echo "TERMUX_ARCH:"
          echo "$TERMUX_ARCH"


          echo ""
          echo "Java version:"

          java -version


          echo ""
          echo "Javac version:"

          javac -version


          echo ""
          echo "Architecture file:"

          cat /data/TERMUX_ARCH


          echo ""
          echo "Checking NDK:"

          test -d "$NDK"

          echo "NDK OK."


      # ==================================================
      # CHECK OPENJDK RECIPE
      # ==================================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "CHECK OPENJDK 17 RECIPE"
          echo "=========================================="


          RECIPE="termux-packages/packages/openjdk-17/build.sh"


          if [ ! -f "$RECIPE" ]; then

            echo ""
            echo "ERROR: OpenJDK 17 recipe not found."

            exit 1

          fi


          echo ""
          echo "Recipe found:"


          echo "$RECIPE"


          echo ""
          echo "Recipe:"


          sed -n '1,280p' \
            "$RECIPE"


      # ==================================================
      # BUILD OPENJDK 17 ARM64
      # ==================================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e


          cd termux-packages


          # ==========================================
          # ENVIRONMENT
          # ==========================================

          export TERMUX_ARCH=aarch64

          export TERMUX_FORCE_BUILD=true

          export TERMUX_INSTALL_DEPS=true


          export ANDROID_HOME="$HOME/lib/android-sdk-35"

          export ANDROID_SDK_ROOT="$HOME/lib/android-sdk-35"

          export NDK="$HOME/lib/android-ndk-r29"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"


          # ==========================================
          # ARCH FILE
          # ==========================================

          if [ ! -f /data/TERMUX_ARCH ]; then

            echo ""
            echo "Creating /data/TERMUX_ARCH..."

            sudo mkdir -p /data

            echo "aarch64" | \
              sudo tee /data/TERMUX_ARCH \
              > /dev/null

          fi


          # ==========================================
          # VERIFY JAVA
          # ==========================================

          echo ""
          echo "=========================================="
          echo "ANDROID OPENJDK 17 ARM64"
          echo "=========================================="


          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"


          echo ""
          echo "TERMUX_ARCH file:"

          cat /data/TERMUX_ARCH


          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"


          echo ""
          echo "Java:"

          java -version


          echo ""
          echo "Javac:"

          javac -version


          echo ""
          echo "NDK:"
          echo "$NDK"


          # ==========================================
          # BUILD
          # ==========================================

          echo ""
          echo "=========================================="
          echo "STARTING TERMUX BUILD"
          echo "=========================================="


          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ==================================================
      # LOCATE GENERATED OPENJDK
      # ==================================================

      - name: Locate generated OpenJDK
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "LOCATING OPENJDK OUTPUT"
          echo "=========================================="


          echo ""
          echo "Searching JDK directories..."


          find termux-packages \
            -type d \
            \( \
              -path "*/lib/jvm/java-17-openjdk" \
              -o \
              -path "*/lib/jvm/java-17-openjdk*" \
            \) \
            -print \
            || true


          echo ""
          echo "Searching OpenJDK packages..."


          find termux-packages \
            -type f \
            \( \
              -name "*openjdk*17*.deb" \
              -o \
              -name "*openjdk*17*.tar*" \
            \) \
            -print \
            || true


      # ==================================================
      # PREPARE STANDALONE JDK
      # ==================================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "PREPARING STANDALONE JDK"
          echo "=========================================="


          rm -rf output


          mkdir -p output


          # ==========================================
          # FIND JDK
          # ==========================================

          JDK_DIR=$(find termux-packages \
            -type d \
            \( \
              -path "*/lib/jvm/java-17-openjdk" \
              -o \
              -path "*/lib/jvm/java-17-openjdk*" \
            \) \
            -print \
            -quit)


          # ==========================================
          # CHECK
          # ==========================================

          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: OpenJDK directory not found."


            echo ""
            echo "All java directories:"

            find termux-packages \
              -type d \
              -iname "*java*" \
              -print \
              || true


            echo ""
            echo "All generated packages:"

            find termux-packages \
              -type f \
              -name "*.deb" \
              -print \
              || true


            exit 1

          fi


          echo ""
          echo "JDK directory:"
          echo "$JDK_DIR"


          # ==========================================
          # COPY
          # ==========================================

          mkdir -p output/jdk-17


          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


          echo ""
          echo "JDK copied successfully."


      # ==================================================
      # CHECK JDK STRUCTURE
      # ==================================================

      - name: Verify JDK structure
        shell: bash
        run: |

          set -e


          JDK="output/jdk-17"


          echo ""
          echo "=========================================="
          echo "VERIFY JDK STRUCTURE"
          echo "=========================================="


          if [ ! -d "$JDK" ]; then

            echo "ERROR: output/jdk-17 missing."

            exit 1

          fi


          if [ ! -f "$JDK/bin/java" ]; then

            echo "ERROR: bin/java missing."

            exit 1

          fi


          if [ ! -f "$JDK/bin/javac" ]; then

            echo "ERROR: bin/javac missing."

            exit 1

          fi


          if [ ! -d "$JDK/lib" ]; then

            echo "ERROR: JDK lib directory missing."

            exit 1

          fi


          echo ""
          echo "Java:"
          ls -lh "$JDK/bin/java"


          echo ""
          echo "Javac:"
          ls -lh "$JDK/bin/javac"


          echo ""
          echo "JDK structure OK."


      # ==================================================
      # CLEAN JDK
      # ==================================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e


          JDK="output/jdk-17"


          echo ""
          echo "=========================================="
          echo "CLEANING JDK"
          echo "=========================================="


          # ==========================================
          # REMOVE UNNECESSARY DIRECTORIES
          # ==========================================

          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include"


          # ==========================================
          # REMOVE DEBUG FILES
          # ==========================================

          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o -name "*.debug" \
            \) \
            -delete


          # ==========================================
          # REMOVE PYTHON CACHE
          # ==========================================

          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;


          echo ""
          echo "JDK cleaned."


      # ==================================================
      # FIX EXECUTABLE PERMISSIONS
      # ==================================================

      - name: Fix executable permissions
        shell: bash
        run: |

          set -e


          JDK="output/jdk-17"


          echo ""
          echo "=========================================="
          echo "FIXING EXECUTABLE PERMISSIONS"
          echo "=========================================="


          chmod +x \
            "$JDK/bin/"* \
            || true


          echo ""
          echo "java:"

          ls -lh "$JDK/bin/java"


          echo ""
          echo "javac:"

          ls -lh "$JDK/bin/javac"


      # ==================================================
      # VERIFY ARM64
      # ==================================================

      - name: Verify ARM64 binaries
        shell: bash
        run: |

          set -e


          JDK="output/jdk-17"


          echo ""
          echo "=========================================="
          echo "VERIFY ARM64 BINARIES"
          echo "=========================================="


          echo ""
          echo "java binary:"

          file "$JDK/bin/java"


          echo ""
          echo "javac binary:"

          file "$JDK/bin/javac"


          # ==========================================
          # JAVA ARCHITECTURE
          # ==========================================

          if ! file "$JDK/bin/java" | \
            grep -Eiq \
            "aarch64|ARM aarch64|ARM64"; then

            echo ""
            echo "ERROR: java is NOT ARM64."

            exit 1

          fi


          # ==========================================
          # JAVAC ARCHITECTURE
          # ==========================================

          if ! file "$JDK/bin/javac" | \
            grep -Eiq \
            "aarch64|ARM aarch64|ARM64"; then

            echo ""
            echo "ERROR: javac is NOT ARM64."

            exit 1

          fi


          echo ""
          echo "ARM64 verification successful."


      # ==================================================
      # SHOW JDK SIZE
      # ==================================================

      - name: Show JDK size
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "JDK SIZE"
          echo "=========================================="


          du -sh output/jdk-17


      # ==================================================
      # CREATE ZIP
      # ==================================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "CREATING JDK ZIP"
          echo "=========================================="


          rm -f \
            android-jdk17-arm64.zip


          cd output


          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17


          cd ..


          echo ""
          echo "ZIP created:"


          ls -lh \
            android-jdk17-arm64.zip


      # ==================================================
      # TEST ZIP
      # ==================================================

      - name: Test JDK ZIP
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "TESTING ZIP"
          echo "=========================================="


          unzip -t \
            android-jdk17-arm64.zip


          echo ""
          echo "ZIP test successful."


      # ==================================================
      # CHECK ZIP CONTENT
      # ==================================================

      - name: Check ZIP content
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "ZIP CONTENT"
          echo "=========================================="


          unzip -l \
            android-jdk17-arm64.zip \
            | head -100


      # ==================================================
      # SHA256
      # ==================================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "GENERATING SHA256"
          echo "=========================================="


          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256


          echo ""
          echo "SHA256:"


          cat \
            android-jdk17-arm64.zip.sha256


      # ==================================================
      # UPLOAD ARTIFACT
      # ==================================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4

        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          retention-days: 30


      # ==================================================
      # CREATE GITHUB RELEASE
      # ==================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
