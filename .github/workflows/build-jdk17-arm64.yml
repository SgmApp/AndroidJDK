name: Build Android OpenJDK 17 ARM64

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:

    name: Build Android OpenJDK 17 ARM64

    runs-on: ubuntu-22.04

    env:
      DEBIAN_FRONTEND: noninteractive
      TERMUX_ARCH: aarch64

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout AndroidJDK
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL HOST DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Installing build dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            tar \
            xz-utils \
            bzip2 \
            gzip \
            patch \
            file \
            rsync \
            build-essential \
            autoconf \
            automake \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxext-dev \
            libxrender-dev \
            libxtst-dev \
            libxt-dev \
            libxrandr-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libfreetype6-dev \
            libjpeg-dev \
            libpng-dev \
            zlib1g-dev \
            liblcms2-dev \
            cpio \
            mercurial \
            bison \
            flex \
            gawk \
            gettext \
            python3 \
            python3-pip \
            python3-venv \
            rsync

          echo ""
          echo "Host dependencies installed."


      # ============================================================
      # 3. JAVA 17
      # ============================================================

      - name: Install Java 17
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Installing Java 17"
          echo "=========================================="

          sudo apt-get install -y openjdk-17-jdk

          echo ""
          echo "Java versions:"
          update-alternatives --list java || true

          echo ""
          java -version

          echo ""
          javac -version


      # ============================================================
      # 4. CHECKOUT TERMUX PACKAGES
      # ============================================================

      - name: Clone Termux packages
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Cloning Termux packages"
          echo "=========================================="

          git clone \
            --depth 1 \
            https://github.com/termux/termux-packages.git \
            termux-packages

          cd termux-packages

          echo ""
          echo "Termux commit:"
          git rev-parse HEAD


      # ============================================================
      # 5. SETUP TERMUX BUILD ENVIRONMENT
      # ============================================================

      - name: Setup Termux build environment
        shell: bash
        run: |

          set -e

          cd termux-packages

          echo "=========================================="
          echo "Setting up Termux build environment"
          echo "=========================================="

          chmod +x scripts/setup-ubuntu.sh
          chmod +x scripts/setup-android-sdk.sh

          echo ""
          echo "Running setup-ubuntu.sh..."

          ./scripts/setup-ubuntu.sh

          echo ""
          echo "Running setup-android-sdk.sh..."

          ./scripts/setup-android-sdk.sh


      # ============================================================
      # 6. DETECT SDK / NDK
      # ============================================================

      - name: Detect Android SDK and NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "Detecting Android SDK / NDK"
          echo "=========================================="

          echo ""
          echo "HOME:"
          echo "$HOME"

          echo ""
          echo "Contents of \$HOME/lib:"
          ls -la "$HOME/lib" || true

          echo ""

          # --------------------------------------------------------
          # SDK
          # --------------------------------------------------------

          if [ -d "$HOME/lib/android-sdk" ]; then

            SDK="$HOME/lib/android-sdk"

          elif [ -d "$HOME/lib/android-sdk-35" ]; then

            SDK="$HOME/lib/android-sdk-35"

          else

            SDK="$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name 'android-sdk*' \
              -print -quit 2>/dev/null || true)"

          fi


          # --------------------------------------------------------
          # NDK
          # --------------------------------------------------------

          if [ -d "$HOME/lib/android-ndk-r29" ]; then

            NDK="$HOME/lib/android-ndk-r29"

          else

            NDK="$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name 'android-ndk-*' \
              -print -quit 2>/dev/null || true)"

          fi


          # --------------------------------------------------------
          # VERIFY SDK
          # --------------------------------------------------------

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then

            echo ""
            echo "ERROR: Android SDK was not installed."

            echo ""
            echo "Searching filesystem..."

            find "$HOME" \
              -maxdepth 4 \
              -type f \
              -name sdkmanager \
              -print 2>/dev/null || true

            exit 1

          fi


          # --------------------------------------------------------
          # VERIFY NDK
          # --------------------------------------------------------

          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then

            echo ""
            echo "ERROR: Android NDK was not installed."

            find "$HOME/lib" \
              -maxdepth 2 \
              -type d \
              -name '*ndk*' \
              -print 2>/dev/null || true

            exit 1

          fi


          # --------------------------------------------------------
          # EXPORT
          # --------------------------------------------------------

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "SDK FOUND"
          echo "=========================================="

          echo "$SDK"

          echo ""
          echo "=========================================="
          echo "NDK FOUND"
          echo "=========================================="

          echo "$NDK"


      # ============================================================
      # 7. VERIFY SDK
      # ============================================================

      - name: Verify Android SDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID SDK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          if [ ! -d "$ANDROID_HOME" ]; then

            echo ""
            echo "ERROR: Android SDK directory not found."

            exit 1

          fi


          # --------------------------------------------------------
          # FIND SDKMANAGER
          # --------------------------------------------------------

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"

          else

            SDKMANAGER="$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true)"

          fi


          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then

            echo ""
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -print || true

            exit 1

          fi


          echo ""
          echo "SDKMANAGER:"
          echo "$SDKMANAGER"

          echo ""
          echo "SDK packages:"

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed \
            || true


      # ============================================================
      # 8. VERIFY NDK
      # ============================================================

      - name: Verify Android NDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "VERIFY ANDROID NDK"
          echo "=========================================="

          echo ""
          echo "NDK:"
          echo "$NDK"

          if [ ! -d "$NDK" ]; then

            echo ""
            echo "ERROR: NDK directory not found."

            exit 1

          fi


          if [ ! -f "$NDK/source.properties" ]; then

            echo ""
            echo "ERROR: NDK source.properties missing."

            exit 1

          fi


          echo ""
          echo "NDK source.properties:"
          cat "$NDK/source.properties"


          echo ""
          echo "NDK clang:"

          if [ -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then

            ls -lh \
              "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"

          else

            echo "WARNING: clang not found at expected location."

          fi


      # ============================================================
      # 9. CHECK OPENJDK 17 RECIPE
      # ============================================================

      - name: Check OpenJDK 17 recipe
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "CHECK OPENJDK 17 RECIPE"
          echo "=========================================="

          RECIPE="termux-packages/packages/openjdk-17/build.sh"

          if [ ! -f "$RECIPE" ]; then

            echo ""
            echo "ERROR: OpenJDK 17 recipe not found."

            exit 1

          fi

          echo ""
          echo "Recipe:"
          echo "$RECIPE"

          echo ""
          sed -n '1,260p' "$RECIPE"


      # ============================================================
      # 10. SHOW BUILD ENVIRONMENT
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Javac:"
          javac -version

          echo ""
          echo "NDK revision:"

          grep \
            "Pkg.Revision" \
            "$NDK/source.properties" \
            || true


      # ============================================================
      # 11. BUILD OPENJDK 17 ARM64
      # ============================================================

      - name: Build OpenJDK 17 ARM64
        shell: bash
        run: |

          set -e
          set -o pipefail

          cd termux-packages

          export TERMUX_ARCH=aarch64

          export ANDROID_HOME="$HOME/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          # --------------------------------------------------------
          # Detect actual SDK if versioned directory is used
          # --------------------------------------------------------

          if [ ! -d "$ANDROID_HOME" ]; then

            ANDROID_HOME="$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name 'android-sdk*' \
              -print -quit)"

            export ANDROID_HOME
            export ANDROID_SDK_ROOT="$ANDROID_HOME"

          fi


          # --------------------------------------------------------
          # Detect NDK
          # --------------------------------------------------------

          if [ -d "$HOME/lib/android-ndk-r29" ]; then

            export NDK="$HOME/lib/android-ndk-r29"

          else

            export NDK="$(find "$HOME/lib" \
              -maxdepth 1 \
              -type d \
              -name 'android-ndk-*' \
              -print -quit)"

          fi


          # --------------------------------------------------------
          # Java
          # --------------------------------------------------------

          if [ -d "/usr/lib/jvm/java-17-openjdk-amd64" ]; then

            export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"

          fi


          # --------------------------------------------------------
          # IMPORTANT TERMUX ARCH
          # --------------------------------------------------------

          export TERMUX_ARCH=aarch64


          echo ""
          echo "=========================================="
          echo "Android OpenJDK 17 ARM64"
          echo "=========================================="

          echo ""
          echo "Architecture:"
          echo "$TERMUX_ARCH"

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "NDK:"
          echo "$NDK"

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Starting Termux build..."


          # --------------------------------------------------------
          # BUILD
          # --------------------------------------------------------

          ./build-package.sh \
            -a aarch64 \
            -f \
            -I \
            openjdk-17


      # ============================================================
      # 12. FIND OPENJDK OUTPUT
      # ============================================================

      - name: Locate OpenJDK output
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "LOCATE OPENJDK OUTPUT"
          echo "=========================================="

          echo ""
          echo "Searching java-17-openjdk..."

          find termux-packages \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print || true


          echo ""
          echo "Searching OpenJDK files..."

          find termux-packages \
            -type f \
            \( \
              -name "java" \
              -o \
              -name "javac" \
            \) \
            -print | head -100 || true


          echo ""
          echo "Searching DEB packages..."

          find termux-packages \
            -type f \
            -name "*openjdk*17*.deb" \
            -print || true


      # ============================================================
      # 13. PREPARE STANDALONE JDK
      # ============================================================

      - name: Prepare standalone JDK
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "PREPARE STANDALONE JDK"
          echo "=========================================="

          rm -rf output

          mkdir -p output/jdk-17


          # --------------------------------------------------------
          # First try installed package prefix
          # --------------------------------------------------------

          JDK_DIR=""

          JDK_DIR=$(find termux-packages \
            -type d \
            -path "*/lib/jvm/java-17-openjdk" \
            -print -quit \
            2>/dev/null || true)


          # --------------------------------------------------------
          # If not found, search massage directory
          # --------------------------------------------------------

          if [ -z "$JDK_DIR" ]; then

            JDK_DIR=$(find termux-packages \
              -type d \
              -path "*/massage/lib/jvm/java-17-openjdk" \
              -print -quit \
              2>/dev/null || true)

          fi


          # --------------------------------------------------------
          # If not found, extract generated DEB
          # --------------------------------------------------------

          if [ -z "$JDK_DIR" ]; then

            DEB=$(find termux-packages \
              -type f \
              -name "*openjdk*17*.deb" \
              -print -quit \
              2>/dev/null || true)


            if [ -n "$DEB" ]; then

              echo ""
              echo "Found DEB:"
              echo "$DEB"

              mkdir -p extracted-jdk

              dpkg-deb \
                -x "$DEB" \
                extracted-jdk

              JDK_DIR=$(find extracted-jdk \
                -type d \
                -path "*/lib/jvm/java-17-openjdk" \
                -print -quit \
                2>/dev/null || true)

            fi

          fi


          # --------------------------------------------------------
          # Final check
          # --------------------------------------------------------

          if [ -z "$JDK_DIR" ]; then

            echo ""
            echo "ERROR: OpenJDK 17 directory not found."

            echo ""
            echo "Full directory search:"

            find termux-packages \
              -maxdepth 8 \
              -type d \
              -iname "*java*" \
              -print \
              | head -200 || true

            exit 1

          fi


          echo ""
          echo "JDK directory:"
          echo "$JDK_DIR"


          # --------------------------------------------------------
          # COPY
          # --------------------------------------------------------

          cp -a \
            "$JDK_DIR"/. \
            output/jdk-17/


          echo ""
          echo "JDK copied."

          ls -lah output/jdk-17


      # ============================================================
      # 14. CLEAN JDK
      # ============================================================

      - name: Clean JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "CLEAN JDK"
          echo "=========================================="

          # --------------------------------------------------------
          # Remove unnecessary documentation
          # --------------------------------------------------------

          rm -rf \
            "$JDK/man" \
            "$JDK/demo" \
            "$JDK/sample" \
            "$JDK/include" \
            "$JDK/share/doc" \
            "$JDK/share/man"


          # --------------------------------------------------------
          # Remove debug files
          # --------------------------------------------------------

          find "$JDK" \
            -type f \
            \( \
              -name "*.debuginfo" \
              -o \
              -name "*.debug" \
            \) \
            -delete


          # --------------------------------------------------------
          # Remove caches
          # --------------------------------------------------------

          find "$JDK" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} \;


          echo ""
          echo "JDK cleaned."


      # ============================================================
      # 15. FIX PERMISSIONS
      # ============================================================

      - name: Fix JDK executable permissions
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "FIX EXECUTABLE PERMISSIONS"
          echo "=========================================="


          if [ -d "$JDK/bin" ]; then

            chmod +x "$JDK/bin/"* || true

          fi


          echo ""
          echo "Java:"

          ls -lh \
            "$JDK/bin/java"


          echo ""
          echo "Javac:"

          ls -lh \
            "$JDK/bin/javac"


      # ============================================================
      # 16. VERIFY JDK
      # ============================================================

      - name: Verify JDK
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          echo "=========================================="
          echo "VERIFY JDK"
          echo "=========================================="


          # --------------------------------------------------------
          # Required files
          # --------------------------------------------------------

          test -f "$JDK/bin/java"

          test -f "$JDK/bin/javac"

          test -d "$JDK/lib"


          echo ""
          echo "Required JDK files found."


          # --------------------------------------------------------
          # Check ELF architecture
          # --------------------------------------------------------

          echo ""
          echo "Checking java architecture..."

          file "$JDK/bin/java"


          echo ""
          echo "Checking javac architecture..."

          file "$JDK/bin/javac"


          # --------------------------------------------------------
          # Check ARM64
          # --------------------------------------------------------

          if file "$JDK/bin/java" | grep -qi \
            "ARM aarch64\|ARM64"; then

            echo ""
            echo "ARM64 Java binary detected."

          else

            echo ""
            echo "WARNING: java binary architecture could not be confirmed as ARM64."

          fi


          echo ""
          echo "=========================================="
          echo "JDK STRUCTURE OK"
          echo "=========================================="


          find "$JDK/bin" \
            -maxdepth 1 \
            -type f \
            -print


      # ============================================================
      # 17. CREATE VERSION FILE
      # ============================================================

      - name: Create JDK metadata
        shell: bash
        run: |

          set -e

          JDK="output/jdk-17"

          cat > "$JDK/ANDROIDJDK_INFO.txt" <<EOF
AndroidJDK

Distribution: SgmApp AndroidJDK
Java: OpenJDK 17
Architecture: ARM64 / AArch64
Platform: Android / Termux Bionic
Built by: GitHub Actions

Repository:
https://github.com/SgmApp/AndroidJDK
EOF


      # ============================================================
      # 18. CREATE ZIP
      # ============================================================

      - name: Create ARM64 JDK ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "CREATE JDK ZIP"
          echo "=========================================="


          rm -f \
            android-jdk17-arm64.zip


          cd output


          zip -r -9 \
            ../android-jdk17-arm64.zip \
            jdk-17


          cd ..


          echo ""
          echo "ZIP created:"

          ls -lh \
            android-jdk17-arm64.zip


      # ============================================================
      # 19. TEST ZIP
      # ============================================================

      - name: Test JDK ZIP
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "TEST ZIP"
          echo "=========================================="


          unzip -t \
            android-jdk17-arm64.zip


          echo ""
          echo "ZIP test successful."


      # ============================================================
      # 20. SHOW ZIP CONTENTS
      # ============================================================

      - name: Show ZIP contents
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "ZIP CONTENTS"
          echo "=========================================="


          unzip -l \
            android-jdk17-arm64.zip \
            | head -200


      # ============================================================
      # 21. SHA256
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |

          set -e

          sha256sum \
            android-jdk17-arm64.zip \
            > android-jdk17-arm64.zip.sha256


          echo ""
          echo "SHA256:"

          cat \
            android-jdk17-arm64.zip.sha256


      # ============================================================
      # 22. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload JDK artifact
        uses: actions/upload-artifact@v4
        with:

          name: android-jdk17-arm64

          path: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # 23. CREATE GITHUB RELEASE
      # ============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')

        uses: softprops/action-gh-release@v2

        with:

          files: |
            android-jdk17-arm64.zip
            android-jdk17-arm64.zip.sha256

          generate_release_notes: true
