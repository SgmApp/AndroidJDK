name: Android SDK Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  build-sdk:

    name: Build Android SDK ZIP

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # JAVA 17
      # ============================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================
      # ANDROID SDK
      # ============================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================
      # ACCEPT LICENSES
      # ============================================

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # ============================================
      # INSTALL SDK
      # ============================================

      - name: Install SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================
      # PREPARE SDK
      # ============================================

      - name: Prepare Android SDK
        run: |

          set -e

          rm -rf android-sdk

          mkdir -p android-sdk

          echo "Copying platform-tools..."

          cp -R \
            "$ANDROID_HOME/platform-tools" \
            android-sdk/platform-tools


          echo "Copying build-tools..."

          mkdir -p android-sdk/build-tools

          cp -R \
            "$ANDROID_HOME/build-tools/35.0.0" \
            android-sdk/build-tools/35.0.0


          echo "Copying platform..."

          mkdir -p android-sdk/platforms

          cp -R \
            "$ANDROID_HOME/platforms/android-35" \
            android-sdk/platforms/android-35


      # ============================================
      # VERIFY SDK
      # ============================================

      - name: Verify SDK
        run: |

          set -e

          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo ""
          echo "Platform Tools:"
          ls -la android-sdk/platform-tools | head


          echo ""
          echo "Build Tools:"
          ls -la android-sdk/build-tools/35.0.0 | head


          echo ""
          echo "Platform:"
          ls -la android-sdk/platforms/android-35 | head


          echo ""
          echo "Checking android.jar..."

          test -f \
            android-sdk/platforms/android-35/android.jar


          echo "android.jar OK"


          echo ""
          echo "Checking aapt2..."

          test -f \
            android-sdk/build-tools/35.0.0/aapt2


          echo "aapt2 OK"


          echo ""
          echo "SDK verification successful."


      # ============================================
      # CREATE ZIP
      # ============================================

      - name: Create SDK ZIP
        run: |

          set -e

          cd android-sdk

          zip -r \
            ../android-sdk.zip \
            .

          cd ..

          echo ""
          echo "================================"
          echo "ZIP CREATED"
          echo "================================"

          ls -lh android-sdk.zip


      # ============================================
      # VERIFY ZIP
      # ============================================

      - name: Verify ZIP
        run: |

          set -e

          echo "================================"
          echo "ZIP CONTENT"
          echo "================================"

          unzip -l android-sdk.zip | head -100


          echo ""
          echo "Checking required files..."

          unzip -l android-sdk.zip |
            grep "platforms/android-35/android.jar"


          unzip -l android-sdk.zip |
            grep "build-tools/35.0.0/aapt2"


          echo ""
          echo "ZIP verification successful."


      # ============================================
      # UPLOAD TO GITHUB RELEASE
      # ============================================

      - name: Upload SDK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          set -e

          echo "================================"
          echo "GITHUB RELEASE"
          echo "================================"


          # ------------------------------------------
          # Check whether release exists
          # ------------------------------------------

          if gh release view v1.0.0 >/dev/null 2>&1
          then

            echo "Release v1.0.0 already exists."

            echo "Uploading android-sdk.zip..."

            gh release upload \
              v1.0.0 \
              android-sdk.zip \
              --clobber

          else

            echo "Release v1.0.0 does not exist."

            echo "Creating release..."

            gh release create \
              v1.0.0 \
              android-sdk.zip \
              --title "Android SDK 35" \
              --notes "Android SDK package for AndroidAIDE local builds.

SDK Platform:
android-35

Build Tools:
35.0.0

Platform Tools:
Included"

          fi


      # ============================================
      # FINAL
      # ============================================

      - name: Show download URL
        env:
          GH_TOKEN: ${{ github.token }}

        run: |

          echo ""
          echo "================================"
          echo "RELEASE COMPLETE"
          echo "================================"

          gh release view v1.0.0

          echo ""
          echo "Download URL:"
          echo "https://github.com/${{ github.repository }}/releases/download/v1.0.0/android-sdk.zip"
